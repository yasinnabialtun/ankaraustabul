<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <!-- Kafa -->
  <circle cx="150" cy="100" r="60" fill="#FFD8B9" />
  
  <!-- Saç ve sakal -->
  <path d="M110 80 Q150 30 190 80" fill="#6D4C41" />
  <path d="M110 80 Q120 100 110 120" fill="#6D4C41" />
  <path d="M190 80 Q180 100 190 120" fill="#6D4C41" />
  <path d="M130 120 Q150 140 170 120" fill="#6D4C41" /> <!-- Sakal -->
  
  <!-- Yüz -->
  <circle cx="130" cy="90" r="5" fill="#333" /> <!-- Sol göz -->
  <circle cx="170" cy="90" r="5" fill="#333" /> <!-- Sağ göz -->
  <path d="M140 110 Q150 115 160 110" fill="none" stroke="#333" stroke-width="2" /> <!-- Ağız -->
  
  <!-- Şapka -->
  <path d="M100 70 Q150 40 200 70 L190 60 Q150 30 110 60 Z" fill="#E53935" />
  <rect x="100" y="70" width="100" height="10" fill="#E53935" />
  
  <!-- Vücut -->
  <rect x="120" y="160" width="60" height="100" fill="#1976D2" /> <!-- Mavi tulum üst -->
  <rect x="120" y="260" width="60" height="100" fill="#1976D2" /> <!-- Mavi tulum alt -->
  
  <!-- Kollar -->
  <rect x="90" y="160" width="30" height="80" fill="#1976D2" /> <!-- Sol kol -->
  <rect x="180" y="160" width="30" height="80" fill="#1976D2" /> <!-- Sağ kol -->
  
  <!-- Eller -->
  <circle cx="90" cy="240" r="10" fill="#FFD8B9" /> <!-- Sol el -->
  <circle cx="210" cy="240" r="10" fill="#FFD8B9" /> <!-- Sağ el -->
  
  <!-- Ayaklar -->
  <rect x="120" y="360" width="25" height="20" fill="#333" /> <!-- Sol ayak -->
  <rect x="155" y="360" width="25" height="20" fill="#333" /> <!-- Sağ ayak -->
  
  <!-- Alet kemeri -->
  <rect x="120" y="240" width="60" height="10" fill="#795548" />
  
  <!-- Boru anahtarı -->
  <rect x="70" y="220" width="40" height="10" fill="#90A4AE" />
  <rect x="70" y="220" width="10" height="30" fill="#90A4AE" />
  
  <!-- Boru -->
  <rect x="190" y="220" width="40" height="15" fill="#90A4AE" rx="5" ry="5" />
</svg>
