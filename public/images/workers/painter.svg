<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <!-- Kafa -->
  <circle cx="150" cy="100" r="60" fill="#FFD8B9" />
  
  <!-- Saç -->
  <path d="M110 80 Q150 30 190 80" fill="#8D6E63" />
  <path d="M110 80 Q120 100 110 120" fill="#8D6E63" />
  <path d="M190 80 Q180 100 190 120" fill="#8D6E63" />
  
  <!-- Yüz -->
  <circle cx="130" cy="90" r="5" fill="#333" /> <!-- Sol göz -->
  <circle cx="170" cy="90" r="5" fill="#333" /> <!-- Sağ göz -->
  <path d="M140 110 Q150 120 160 110" fill="none" stroke="#333" stroke-width="2" /> <!-- Ağız -->
  
  <!-- Şapka -->
  <circle cx="150" cy="70" r="50" fill="#FFFFFF" />
  <circle cx="150" cy="70" r="45" fill="#F5F5F5" />
  
  <!-- Vücut -->
  <rect x="120" y="160" width="60" height="100" fill="#FFFFFF" /> <!-- Beyaz tulum üst -->
  <rect x="120" y="260" width="60" height="100" fill="#FFFFFF" /> <!-- Beyaz tulum alt -->
  
  <!-- Boya lekeleri -->
  <circle cx="140" cy="190" r="8" fill="#2196F3" /> <!-- Mavi leke -->
  <circle cx="160" cy="210" r="6" fill="#4CAF50" /> <!-- Yeşil leke -->
  <circle cx="130" cy="230" r="7" fill="#F44336" /> <!-- Kırmızı leke -->
  <circle cx="150" cy="280" r="5" fill="#9C27B0" /> <!-- Mor leke -->
  <circle cx="170" cy="300" r="9" fill="#FFC107" /> <!-- Sarı leke -->
  
  <!-- Kollar -->
  <rect x="90" y="160" width="30" height="80" fill="#FFFFFF" /> <!-- Sol kol -->
  <rect x="180" y="160" width="30" height="80" fill="#FFFFFF" /> <!-- Sağ kol -->
  
  <!-- Eller -->
  <circle cx="90" cy="240" r="10" fill="#FFD8B9" /> <!-- Sol el -->
  <circle cx="210" cy="240" r="10" fill="#FFD8B9" /> <!-- Sağ el -->
  
  <!-- Ayaklar -->
  <rect x="120" y="360" width="25" height="20" fill="#333" /> <!-- Sol ayak -->
  <rect x="155" y="360" width="25" height="20" fill="#333" /> <!-- Sağ ayak -->
  
  <!-- Boya fırçası -->
  <rect x="190" y="220" width="40" height="5" fill="#795548" /> <!-- Fırça sapı -->
  <path d="M230 218 L230 227 L240 222 Z" fill="#795548" /> <!-- Fırça ucu -->
  <path d="M240 217 L240 227 Q250 222 240 217 Z" fill="#4CAF50" /> <!-- Yeşil boya -->
  
  <!-- Boya kutusu -->
  <rect x="60" y="220" width="30" height="20" fill="#E0E0E0" />
  <rect x="60" y="220" width="30" height="5" fill="#2196F3" /> <!-- Mavi boya -->
</svg>
