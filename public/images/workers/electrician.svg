<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <!-- Kafa -->
  <circle cx="150" cy="100" r="60" fill="#FFD8B9" />
  
  <!-- Saç -->
  <path d="M110 80 Q150 30 190 80" fill="#333" />
  <path d="M110 80 Q120 100 110 120" fill="#333" />
  <path d="M190 80 Q180 100 190 120" fill="#333" />
  
  <!-- Yüz -->
  <circle cx="130" cy="90" r="5" fill="#333" /> <!-- Sol göz -->
  <circle cx="170" cy="90" r="5" fill="#333" /> <!-- Sağ göz -->
  <path d="M140 110 Q150 120 160 110" fill="none" stroke="#333" stroke-width="2" /> <!-- Ağız -->
  
  <!-- Baret -->
  <path d="M90 80 Q150 40 210 80 L200 70 Q150 30 100 70 Z" fill="#FFD700" />
  
  <!-- Vücut -->
  <rect x="120" y="160" width="60" height="100" fill="#1E88E5" /> <!-- Mavi üst -->
  <rect x="120" y="260" width="60" height="100" fill="#333" /> <!-- Siyah pantolon -->
  
  <!-- Kollar -->
  <rect x="90" y="160" width="30" height="80" fill="#1E88E5" /> <!-- Sol kol -->
  <rect x="180" y="160" width="30" height="80" fill="#1E88E5" /> <!-- Sağ kol -->
  
  <!-- Eller -->
  <circle cx="90" cy="240" r="10" fill="#FFD8B9" /> <!-- Sol el -->
  <circle cx="210" cy="240" r="10" fill="#FFD8B9" /> <!-- Sağ el -->
  
  <!-- Ayaklar -->
  <rect x="120" y="360" width="25" height="20" fill="#333" /> <!-- Sol ayak -->
  <rect x="155" y="360" width="25" height="20" fill="#333" /> <!-- Sağ ayak -->
  
  <!-- Alet çantası -->
  <rect x="60" y="280" width="40" height="30" fill="#8B4513" />
  <rect x="60" y="280" width="40" height="5" fill="#A52A2A" />
  
  <!-- Elektrik aleti -->
  <rect x="190" y="230" width="30" height="20" fill="#555" />
  <circle cx="205" cy="240" r="5" fill="#FFD700" />
</svg>
